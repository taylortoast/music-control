name: Windows desktop build and deploy

# Builds the Windows desktop installer natively on Windows so electron-builder emits a real NSIS
# installer. A successful push to main can then publish the artifact to the configured VPS.

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'desktop-v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop renderer + main process
        run: npm run build --workspace=apps/desktop

      - name: Package Windows installer (NSIS)
        working-directory: apps/desktop
        env:
          # No code-signing cert in CI; skip auto-discovery so the build does not fail.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-control-windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: music-control-windows-installer
          path: artifact

      - name: Prepare download page
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find artifact -type f -name 'Music Control Setup *.exe' -print -quit)"
          blockmap="$(find artifact -type f -name 'Music Control Setup *.exe.blockmap' -print -quit)"
          test -n "$installer"
          test -n "$blockmap"
          version="$(basename "$installer" | sed -E 's/^Music Control Setup (.*)\.exe$/\1/')"
          sha256="$(sha256sum "$installer" | awk '{print $1}')"
          size_mb="$(awk -v bytes="$(stat -c '%s' "$installer")" 'BEGIN { printf "%d", (bytes + 1048575) / 1048576 }')"
          cp apps/download/index.html deploy-index.html
          sed -E -i \
            -e "s/Music%20Control%20Setup%20[0-9.]+\.exe/Music%20Control%20Setup%20${version}.exe/" \
            -e "s/Download Music Control [0-9.]+ for Windows/Download Music Control ${version} for Windows/" \
            -e "s/<p class=\"details\">Windows 10 or later · [0-9]+ MB/<p class=\"details\">Windows 10 or later · ${size_mb} MB/" \
            -e "s#<p class=\"checksum\">SHA-256: <code>[^<]+</code></p>#<p class=\"checksum\">SHA-256: <code>${sha256}</code></p>#" \
            deploy-index.html
          printf 'Installer: %s\nSHA-256: %s\nSize: %s MB\n' "$version" "$sha256" "$size_mb" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure VPS SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          install -d -m 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519.decoded
            mv ~/.ssh/id_ed25519.decoded ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy installer and download page
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_DEPLOY_PATH"
          installer="$(find artifact -type f -name 'Music Control Setup *.exe' -print -quit)"
          blockmap="$(find artifact -type f -name 'Music Control Setup *.exe.blockmap' -print -quit)"
          installer_name="$(basename "$installer")"
          blockmap_name="$(basename "$blockmap")"
          target="$VPS_USER@$VPS_HOST"
          staging="/tmp/music-control-deploy-${GITHUB_SHA}"
          ssh "$target" "install -d '$staging' '$VPS_DEPLOY_PATH'"
          scp "$installer" "$blockmap" deploy-index.html "$target:$staging/"
          ssh "$target" bash -s -- "$VPS_DEPLOY_PATH" "$staging" "${GITHUB_SHA:0:7}" <<'REMOTE'
          set -eu
          root="$1"
          staging="$2"
          stamp="$3"
          installer="$(find "$staging" -maxdepth 1 -type f -name 'Music Control Setup *.exe' -print -quit)"
          blockmap="$(find "$staging" -maxdepth 1 -type f -name 'Music Control Setup *.exe.blockmap' -print -quit)"
          installer_name="$(basename "$installer")"
          blockmap_name="$(basename "$blockmap")"
          find "$root" -maxdepth 1 -type f \( -name 'Music Control Setup *.exe' -o -name 'Music Control Setup *.exe.blockmap' -o -name 'index.html' \) -print0 |
            while IFS= read -r -d '' file; do cp -p "$file" "$file.bak-$stamp"; done
          install -m 0644 "$staging/$installer_name" "$root/$installer_name"
          install -m 0644 "$staging/$blockmap_name" "$root/$blockmap_name"
          install -m 0644 "$staging/deploy-index.html" "$root/index.html"
          rm -rf "$staging"
          sha256sum "$root/$installer_name"
          REMOTE
