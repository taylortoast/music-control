# Add these locations to the existing music-control and lineup nginx server blocks.
# They keep v2 isolated from production while allowing /api and /hubs to remain same-origin.

# In music-control.taylortoast.tech:
location = /v2 { return 301 /v2/; }
location ^~ /v2/ {
    alias /var/www/music-control-v2/console/;
    try_files $uri $uri/ /v2/index.html;
}

# In lineup.taylortoast.tech:
location = /v2 { return 301 /v2/; }
location ^~ /v2/ {
    alias /var/www/music-control-v2/lineup-board/;
    try_files $uri $uri/ /v2/index.html;
}
